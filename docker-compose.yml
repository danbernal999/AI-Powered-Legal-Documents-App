services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kiradoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d kiradoc" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kiradoc-network

  migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./backend/migrations:/migrations
    command: [ "-path", "/migrations", "-database", "postgres://user:password@postgres:5432/kiradoc?sslmode=disable", "up" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kiradoc-network
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/kiradoc?sslmode=disable
      PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /root/firebase-credentials.json
    volumes:
      - ./firebase-credentials.json:/root/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - kiradoc-network

networks:
  kiradoc-network:
    driver: bridge

volumes:
  postgres_data:
